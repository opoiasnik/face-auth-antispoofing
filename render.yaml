services:
  - type: web
    name: faceauth-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health/ready
    envVars:
      - key: FA_ENVIRONMENT
        value: production
      - key: FA_LOG_JSON
        value: "true"
      - key: FA_SECURITY__JWT_SECRET
        generateValue: true
      - key: FA_SECURITY__TEMPLATE_ENCRYPTION_KEY
        generateValue: true
      - key: FA_SECURITY__EXPOSE_SCORES
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: FA_DATABASE_URL
        fromDatabase:
          name: faceauth-db
          property: connectionString

databases:
  - name: faceauth-db
    databaseName: faceauth
    plan: free
    region: frankfurt
